[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "marine-sbp-asd2segy"
version = "0.1.0"
description = "Convert Parasound ASD/ACF sub-bottom profiler data to SEG-Y."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "Ivan Dudkov" }
]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3"
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "pyproj>=3.5",
  "segyio>=1.9"
]

[project.optional-dependencies]
examples = [
  "jupyter>=1.0",
  "matplotlib>=3.7"
]
dev = [
  "pytest>=7"
]

[project.scripts]
asd2segy = "marine_sbp_asd2segy.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["marine_sbp_asd2segy*"]
